name: Temporary dependency remediation artifact

on:
  push:
    branches: [codex/payment-dependency-hardening]

permissions:
  contents: write

jobs:
  remediate:
    name: Generate compatible npm audit fixes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile for explicit overrides
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Apply compatible fixes without force
        run: npm audit fix
        continue-on-error: true
      - name: Report remaining advisories
        shell: bash
        run: |
          npm audit --json > audit-after.json || true
          node --input-type=commonjs -e "const a=require('./audit-after.json'); const rows=Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range})})); console.log(JSON.stringify({summary:a.metadata?.vulnerabilities,rows},null,2))"
      - name: Commit dependency manifests on this isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): apply compatible npm audit fixes"
            git push origin HEAD:codex/payment-dependency-hardening
          fi
      - name: Upload regenerated manifests for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-output
          path: |
            package.json
            package-lock.json
            audit-after.json
          if-no-files-found: error
