<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>多智能体编排枢纽 · 交互 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04060d;overflow:hidden;font-family:Segoe UI,'PingFang SC',system-ui,sans-serif;color:#eef3fb}
  #c{display:block;cursor:grab} #c:active{cursor:grabbing}
  .vig{position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(ellipse 50% 54% at 50% 48%,transparent 32%,rgba(1,4,10,.46) 70%,rgba(0,2,6,.92) 100%)}

  #title{position:fixed;top:50px;left:60px;z-index:10;max-width:460px;pointer-events:none}
  #title .k{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.38em;color:rgba(95,208,255,.85);margin-bottom:13px}
  #title h1{font-family:'Instrument Serif','Noto Serif SC',serif;font-weight:600;font-size:40px;line-height:1.15;color:#fff}
  #title p{margin-top:13px;font-size:13px;line-height:1.7;color:rgba(147,166,198,.82);max-width:360px}

  /* floating station panels — 每模块专属样式 */
  .lab{position:fixed;z-index:8;transform:translate(-50%,-100%) scale(.92);pointer-events:none;cursor:pointer;white-space:nowrap;opacity:0;filter:blur(8px) saturate(.7);transition:opacity .42s ease,filter .42s ease,transform .42s cubic-bezier(.2,.8,.2,1)}
  .lab.revealed{opacity:.34;filter:blur(1px) saturate(.82);pointer-events:auto}
  .lab.active{opacity:1;filter:blur(0) saturate(1.1);pointer-events:auto}
  .lab.pending{opacity:0;filter:blur(10px) saturate(.55);pointer-events:none}
  .lab .box{position:relative;width:166px;border-radius:13px;overflow:hidden;
    background:linear-gradient(160deg,rgba(12,17,30,.86),rgba(6,10,20,.92));backdrop-filter:blur(12px);
    border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
    box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 22px color-mix(in srgb,var(--c) 26%,transparent),inset 0 1px 0 rgba(255,255,255,.06)}
  .lab.revealed:not(.active) .box{border-color:color-mix(in srgb,var(--c) 28%,transparent);box-shadow:0 10px 28px rgba(0,0,0,.42),0 0 12px color-mix(in srgb,var(--c) 14%,transparent)}
  .lab.active .box{box-shadow:0 18px 50px rgba(0,0,0,.62),0 0 34px color-mix(in srgb,var(--c) 48%,transparent),inset 0 1px 0 rgba(255,255,255,.08)}
  .lab.active .box::after{content:'';position:absolute;inset:0;border-radius:inherit;border:1px solid color-mix(in srgb,var(--c) 88%,white);opacity:.7;pointer-events:none;animation:panel-arrive 1.2s ease-out}
  @keyframes panel-arrive{0%{opacity:0;transform:scale(.92)}42%{opacity:1;transform:scale(1.02)}100%{opacity:.7;transform:scale(1)}}
  /* color accent bar on top */
  .lab .box::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.9}
  .lab .hd{display:flex;align-items:center;gap:7px;padding:9px 12px 7px}
  .lab .ic{width:21px;height:21px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
    background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
  .lab .ic svg{width:13px;height:13px;stroke:var(--c);fill:none;stroke-width:1.7}
  .lab .no{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--c);letter-spacing:.05em}
  .lab .nm{font-size:13.5px;font-weight:600;color:#fff;letter-spacing:.01em}
  .lab .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:bp 1.6s ease-in-out infinite}
  @keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
  /* mini live viz */
  .lab .viz{height:38px;margin:0 12px;border-radius:8px;background:rgba(255,255,255,.025);border:1px solid color-mix(in srgb,var(--c) 16%,transparent);position:relative;overflow:hidden}
  .lab .viz svg{width:100%;height:100%;display:block}
  /* stat readout */
  .lab .stat{display:flex;align-items:baseline;justify-content:space-between;padding:7px 12px 4px}
  .lab .stat .lbl{font-size:10px;color:#8ea0bf}
  .lab .stat .v{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--c)}
  .lab .ag{display:flex;gap:5px;padding:2px 12px 11px}
  .lab .ag span{flex:1;text-align:center;font-size:9.5px;color:#cdd9ee;padding:3px 4px;border-radius:5px;background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
  .lab .stem{position:absolute;left:50%;top:100%;width:1px;height:16px;background:linear-gradient(var(--c),transparent);transform:translateX(-50%)}
  .lab .stem::after{content:'';position:absolute;left:50%;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);transform:translate(-50%,50%)}
  .lab:hover{filter:brightness(1.12)}
  .lab:hover .box{border-color:var(--c);box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 34px color-mix(in srgb,var(--c) 45%,transparent)}

  #corelab{position:fixed;z-index:9;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;pointer-events:none}
  #corelab .ck{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.2em;color:#5fd0ff}
  #corelab .cn{font-family:'Instrument Serif','Noto Serif SC',serif;font-size:23px;color:#fff;margin:2px 0}
  #corelab .cs{font-size:11px;color:rgba(95,208,255,.9)}

  #hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;color:rgba(120,150,190,.65);pointer-events:none}

  /* modal */
  #modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center}
  #modal.open{display:flex}
  #modal .scrim{position:absolute;inset:0;background:rgba(2,5,12,.6);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s}
  #modal.open .scrim{opacity:1}
  #card{position:relative;width:440px;max-width:88%;border-radius:16px;padding:26px 28px;transform:translateY(14px) scale(.97);opacity:0;transition:all .34s cubic-bezier(.2,.7,.2,1);
    background:linear-gradient(155deg,rgba(14,20,36,.95),rgba(8,12,24,.97));border:1px solid rgba(120,160,220,.22);box-shadow:0 40px 110px rgba(0,0,0,.6)}
  #modal.open #card{transform:translateY(0) scale(1);opacity:1}
  #card .c-desc{font-size:15px;line-height:1.8;color:#d6e0f2}
  #card .c-ag{display:flex;gap:10px;margin-top:16px}
  #card .c-ag span{flex:1;text-align:center;font-size:13px;padding:9px;border-radius:9px;background:rgba(255,255,255,.04)}
  #card .c-x{position:absolute;top:16px;right:18px;width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04);color:#cdd9ee;font-size:15px;cursor:pointer}
  #card .c-x:hover{background:rgba(255,255,255,.1)}

  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;z-index:60;background:#04060d;transition:opacity .6s}
  #load.hide{opacity:0;pointer-events:none}
  #load .ring{width:44px;height:44px;border:2px solid rgba(95,208,255,.2);border-top-color:#5fd0ff;border-radius:50%;animation:spin 1s linear infinite}
  #load .txt{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;color:#5fd0ff}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vig"></div>
<div id="title">
  <div class="k">MULTI-AGENT&nbsp;&nbsp;ORCHESTRATION&nbsp;&nbsp;HUB</div>
  <h1>统筹编排的<br/>多智能体学习枢纽</h1>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/libs/meshopt_decoder.module.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/meshopt_decoder.module.js"

</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js'
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

const STATIONS = [
  { key:'profile',  no:'01', name:'画像诊断', en:'DIAGNOSE', c:'#8b7ff5', ui:'radar',   stat:'掌握度', val:'32%', agents:['画像采集','薄弱诊断'], desc:'采集学习行为与作答数据，构建多维学情画像，定位知识薄弱点与风险标签，为后续编排提供诊断依据。' },
  { key:'path',     no:'02', name:'路径编排', en:'PLAN',     c:'#27c0e6', ui:'network', stat:'补救节点', val:'+3', agents:['路径规划','动态重排'], desc:'依据诊断画像规划个性化学习路径，插入补救节点，并随学习进展动态重排，保证路径始终贴合学情。' },
  { key:'resource', no:'03', name:'资源生成', en:'PRODUCE',  c:'#1abf90', ui:'cards',   stat:'已匹配', val:'10', agents:['资源检索','个性生成'], desc:'按路径匹配讲解视频、例题与专项练习，并按学习者特征个性化生成与优化学习素材。' },
  { key:'tutor',    no:'04', name:'辅导互动', en:'TUTOR',    c:'#e0a23a', ui:'chat',    stat:'答疑轮次', val:'3', agents:['讲解辅导','互动答疑'], desc:'提供分步讲解与实时答疑，主动追问与互动激励，完成针对薄弱点的个性化教学。' },
  { key:'eval',     no:'05', name:'测评分析', en:'ASSESS',   c:'#e0556e', ui:'bars',    stat:'晨测得分', val:'82', agents:['评估出题','错因分析'], desc:'生成诊断题与测评，分析错因与掌握度变化，形成评估证据链。' },
  { key:'feedback', no:'06', name:'反馈复盘', en:'FEEDBACK', c:'#5b8cff', ui:'loop',    stat:'掌握度', val:'61%', agents:['反馈回写','成长复盘'], desc:'将评估证据回写学习画像，更新明日学习路径，推送成长报告，驱动闭环持续优化。' },
];

const STATION_KEYS = STATIONS.map(s => s.key);
const externalBeatToStation = { loop: 'feedback' };
const stationToExternalBeat = { feedback: 'loop' };
const revealedStations = new Set();
let activeStationKey = STATIONS[0].key;
let progressTimer = null;

function normalizeStationKey(id) {
  const key = externalBeatToStation[id] || id;
  return STATION_KEYS.includes(key) ? key : STATIONS[0].key;
}

function externalBeatId(key) {
  return stationToExternalBeat[key] || key;
}

function revealThroughStation(key) {
  const targetIndex = STATION_KEYS.indexOf(key);
  revealedStations.clear();
  STATION_KEYS.forEach((stationKey, index) => {
    if (index <= targetIndex) revealedStations.add(stationKey);
  });
}

function updateLabelStates() {
  STATIONS.forEach((s) => {
    const el = labels[s.key];
    if (!el) return;
    el.classList.toggle('active', s.key === activeStationKey);
    el.classList.toggle('revealed', revealedStations.has(s.key));
    el.classList.toggle('pending', !revealedStations.has(s.key));
  });
}

function setActiveStation(id, options = {}) {
  const key = normalizeStationKey(id);
  activeStationKey = key;
  revealThroughStation(key);
  updateLabelStates();
  if (options.notify !== false) {
    window.parent?.postMessage({ type: 'agenthub:beat', id: externalBeatId(key) }, '*');
  }
  if (options.restart !== false) restartProgressTimer();
}

function advanceStation() {
  const idx = STATION_KEYS.indexOf(activeStationKey);
  const nextKey = STATION_KEYS[(idx + 1) % STATION_KEYS.length];
  if (idx === STATION_KEYS.length - 1) revealedStations.clear();
  setActiveStation(nextKey, { restart: false });
}

function restartProgressTimer() {
  if (progressTimer) clearInterval(progressTimer);
  progressTimer = setInterval(advanceStation, 3600);
}

const cvs = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.76;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x040c18, 0.0036);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.02).texture;
scene.add(new THREE.HemisphereLight(0x24405f, 0x05080f, 0.26));
const key = new THREE.DirectionalLight(0xdfeaff, 1.12); key.position.set(-12, 22, 14); scene.add(key);
const rim = new THREE.DirectionalLight(0x3f72ff, 0.48); rim.position.set(16, 8, -14); scene.add(rim);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 2000);

// ===== 深蓝黑数字中控空间 =====
const ENV = { grid:null, particles:null, scanRings:[], glowDisc:null };
function buildEnvironment() {
  // 1) 深蓝黑渐变天幕 — 整体压暗，顶部暗海军蓝 → 地平线近黑
  const skyGeo = new THREE.SphereGeometry(440, 48, 32);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { top:{value:new THREE.Color(0x040d1a)}, mid:{value:new THREE.Color(0x020810)}, bot:{value:new THREE.Color(0x010407)} },
    vertexShader: `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vP; uniform vec3 top,mid,bot; void main(){ float h=normalize(vP).y; vec3 c = h>0.0 ? mix(mid,top,pow(h,0.85)) : mix(mid,bot,pow(-h,0.45)); gl_FragColor=vec4(c,1.0);} `
  });
  scene.add(new THREE.Mesh(skyGeo, skyMat));

  // 2) 深色玻璃地台 — 近黑，仅中心一点冷光晕，边界柔化消失（非亮圆盘）
  const discGeo = new THREE.CircleGeometry(150, 96).rotateX(-Math.PI/2);
  const discMat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false,
    uniforms:{ col:{value:new THREE.Color(0x0ccfff)} },
    vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    // 只在很靠中心处给极弱蓝光晕，向外迅速消失 → 没有硬边、没有大面积亮蓝
    fragmentShader:`varying vec2 vUv; uniform vec3 col; void main(){ float d=distance(vUv,vec2(0.5)); float a=smoothstep(0.22,0.0,d)*0.07; gl_FragColor=vec4(col,a);} `
  });
  const disc = new THREE.Mesh(discGeo, discMat); disc.position.y = -0.015; scene.add(disc); ENV.glowDisc = disc;

  // 2b) 近黑实体地台（接住模型与阴影，暗金属/玻璃感）
  const floorMat = new THREE.MeshStandardMaterial({ color:0x02060d, roughness:0.5, metalness:0.55, envMapIntensity:0.28 });
  const floor = new THREE.Mesh(new THREE.CircleGeometry(150,96).rotateX(-Math.PI/2), floorMat);
  floor.position.y = -0.03; scene.add(floor);

  // 3) 极弱 HUD 网格 — 只同心圆，暗蓝灰，透明度 6–11%，远处渐隐；不放射、不黑线
  const gridG = new THREE.Group();
  function ringLine(r, op){ const pts=[]; for(let i=0;i<=140;i++){const a=i/140*Math.PI*2; pts.push(new THREE.Vector3(r*Math.cos(a),0,r*Math.sin(a)));}
    return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color:0x1c3a5a, transparent:true, opacity:op })); }
  for (let r=8; r<=120; r+=8){ const fade = 0.11 * (1 - r/150); gridG.add(ringLine(r, Math.max(0.05, fade))); }
  // 仅极少数极淡的方位刻度（短线，不贯穿），透明度很低
  for (let k=0;k<24;k++){ const a=k/24*Math.PI*2; const r0=9,r1=11; const pts=[new THREE.Vector3(r0*Math.cos(a),0,r0*Math.sin(a)), new THREE.Vector3(r1*Math.cos(a),0,r1*Math.sin(a))];
    gridG.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color:0x244568, transparent:true, opacity:0.18 }))); }
  gridG.position.y = -0.005; scene.add(gridG); ENV.grid = gridG;

  // 4) 扩散扫描环 — 更细更淡，作为氛围微光
  for (let i=0;i<2;i++){
    const g = new THREE.RingGeometry(1,1.025,120).rotateX(-Math.PI/2);
    const m = new THREE.MeshBasicMaterial({ color:0x2f86d6, transparent:true, opacity:0.16, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending });
    const ring = new THREE.Mesh(g,m); ring.position.y=0.01; scene.add(ring); ENV.scanRings.push(ring);
  }

  // ===== 核心同心数据环（对标概念图：发光多层环 + 流动光弧）=====
  const FX = { rings:[], arcs:[], beam:null, beamCore:null, baseGlow:null };
  const ringRadii = [3.6, 4.7, 5.9, 7.2];
  ringRadii.forEach((r,i)=>{
    // 稳定底环（细，青蓝，加性发光）
    const tg = new THREE.TorusGeometry(r, 0.022+ (i%2)*0.01, 8, 160).rotateX(Math.PI/2);
    const tm = new THREE.MeshBasicMaterial({ color: i%2? 0x3f9ee0 : 0x5fd0ff, transparent:true, opacity:0.42, blending:THREE.AdditiveBlending, depthWrite:false });
    const ring = new THREE.Mesh(tg, tm); ring.position.y = 0.16 + i*0.015; scene.add(ring); FX.rings.push(ring);
    // 流动亮弧（短 thetaLength，绕圈旋转）
    const ag = new THREE.TorusGeometry(r, 0.05, 10, 64, Math.PI*0.5).rotateX(Math.PI/2);
    const am = new THREE.MeshBasicMaterial({ color:0xbfeaff, transparent:true, opacity:0.64, blending:THREE.AdditiveBlending, depthWrite:false });
    const arc = new THREE.Mesh(ag, am); arc.position.y = 0.165 + i*0.015; scene.add(arc);
    FX.arcs.push({ mesh:arc, sp: (i%2?-1:1)*(0.25+i*0.06), off:i*1.3 });
  });
  // 核心底座辉光盘
  const bgGeo = new THREE.CircleGeometry(8, 64).rotateX(-Math.PI/2);
  const bgMat = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{ col:{value:new THREE.Color(0x2f9fe0)} },
    vertexShader:`varying vec2 vU; void main(){ vU=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying vec2 vU; uniform vec3 col; void main(){ float d=distance(vU,vec2(0.5)); float a=smoothstep(0.5,0.06,d)*0.18; gl_FragColor=vec4(col,a);} ` });
  FX.baseGlow = new THREE.Mesh(bgGeo, bgMat); FX.baseGlow.position.y=0.05; scene.add(FX.baseGlow);

  // ===== 中央垂直能量光柱（对标概念图蓝色光柱）=====
  const beamMat = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
    uniforms:{ col:{value:new THREE.Color(0x6fc4ff)}, t:{value:0} },
    vertexShader:`varying float vY; void main(){ vY=uv.y; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`varying float vY; uniform vec3 col; uniform float t; void main(){ float edge=smoothstep(0.0,0.5,1.0-abs(vY-0.0)); float fade=pow(1.0-vY,1.3); float pulse=0.8+0.2*sin(t*3.0 - vY*10.0); gl_FragColor=vec4(col, fade*0.26*pulse);} ` });
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.16, 26, 24, 1, true), beamMat);
  beam.position.y = 13.5; scene.add(beam); FX.beam = beam; FX.beamMat = beamMat;

  coreLine.position.y = 13.5; scene.add(coreLine); FX.beamCore = coreLine;
  // 光柱底部起点光球
  const beamOrb = new THREE.Mesh(new THREE.SphereGeometry(0.5,24,24), new THREE.MeshBasicMaterial({ color:0xbfeaff, transparent:true, opacity:0.46, blending:THREE.AdditiveBlending, depthWrite:false }));
  beamOrb.position.y = 1.2; scene.add(beamOrb); FX.beamOrb = beamOrb;
  ENV.FX = FX;

  // 5) 漂浮光尘 — 存基础极坐标，做"对冲呼吸"(周期性朝中心汇聚再扩散)
  const N=560;

  const dcA=new THREE.Color(0x4f8fc4), dcB=new THREE.Color(0x84b6e0), dcW=new THREE.Color(0xd8b890);
  const dcol=new Float32Array(N*3);
  for(let i=0;i<N;i++){

    dust.pos[i*3]=r*Math.cos(a); dust.pos[i*3+1]=y; dust.pos[i*3+2]=r*Math.sin(a);
    const c = Math.random()<0.06 ? dcW : (Math.random()<0.5?dcA:dcB);
    dcol[i*3]=c.r; dcol[i*3+1]=c.g; dcol[i*3+2]=c.b;
  }
  const pg=new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(dust.pos,3).setUsage(THREE.DynamicDrawUsage));
  pg.setAttribute('color', new THREE.BufferAttribute(dcol,3));
  const pm=new THREE.PointsMaterial({ size:0.42, vertexColors:true, transparent:true, opacity:0.5, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true });
  ENV.particles = new THREE.Points(pg,pm); scene.add(ENV.particles);
  ENV.dust = dust; ENV.dustGeo = pg;

  // 5b) 能量上升微粒 — 从地面缓缓升起并被中枢吸入(吐纳感)
  const K=140;
  const motes = { pos:new Float32Array(K*3), data:[] };
  for(let i=0;i<K;i++){
    const r=6+Math.random()*46, a=Math.random()*Math.PI*2;
    motes.data.push({ r, a, y:Math.random()*30, vy:1.2+Math.random()*2.4, inward:0.05+Math.random()*0.12 });
    motes.pos[i*3]=r*Math.cos(a); motes.pos[i*3+1]=Math.random()*30; motes.pos[i*3+2]=r*Math.sin(a);
  }
  const mg=new THREE.BufferGeometry();
  mg.setAttribute('position', new THREE.BufferAttribute(motes.pos,3).setUsage(THREE.DynamicDrawUsage));
  const mm=new THREE.PointsMaterial({ color:0x5fd0ff, size:0.34, transparent:true, opacity:0.65, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true });
  ENV.motes = new THREE.Points(mg,mm); scene.add(ENV.motes);
  ENV.motesData = motes; ENV.motesGeo = mg;


  // 6) 远景城市/数据灯光 — 很远、很暗、很虚，只提供地平线纵深
  const M=200, hp=new Float32Array(M*3);
  for(let i=0;i<M;i++){ const a=Math.random()*Math.PI*2, r=180+Math.random()*140; hp[i*3]=r*Math.cos(a); hp[i*3+1]=Math.random()*5-1; hp[i*3+2]=r*Math.sin(a); }
  const hg=new THREE.BufferGeometry(); hg.setAttribute('position', new THREE.BufferAttribute(hp,3));
  scene.add(new THREE.Points(hg, new THREE.PointsMaterial({ color:0x5a86b0, size:0.9, transparent:true, opacity:0.4, depthWrite:false, blending:THREE.AdditiveBlending })));

  // 7) 几条极远的暗蓝光带（数字穹顶氛围）
  for (let i=0;i<4;i++){
    const a=i/4*Math.PI*2 + 0.4, r=170;

    band.position.set(r*Math.cos(a), 8+Math.random()*20, r*Math.sin(a)); band.lookAt(0, band.position.y, 0); scene.add(band);
  }
}

function buildFallbackHub() {
  const root = new THREE.Group();
  scene.add(root); refs.root = root;

  const hubRadius = 12;
  const stationY = 3.2;

  // Core base platform
  const coreBaseGeo = new THREE.CylinderGeometry(4.2, 5, 0.6, 48);
  const coreBaseMat = new THREE.MeshStandardMaterial({
    color: 0x0a1a2e,
    metalness: 0.8,
    roughness: 0.25,
    emissive: 0x0044aa,
    emissiveIntensity: 0.15
  });
  const coreBase = new THREE.Mesh(coreBaseGeo, coreBaseMat);
  coreBase.position.y = 0.3;
  root.add(coreBase);

  // Core upper sphere
  const coreSphereGeo = new THREE.IcosahedronGeometry(1.8, 2);
  const coreSphereMat = new THREE.MeshStandardMaterial({
    color: 0x1e40af,
    metalness: 0.6,
    roughness: 0.3,
    emissive: 0x3b82f6,
    emissiveIntensity: 0.8
  });
  const coreSphere = new THREE.Mesh(coreSphereGeo, coreSphereMat);
  coreSphere.position.y = 3;
  root.add(coreSphere);
  refs.coreSignal = coreSphere;
  refs.coreEmis.push({ m: coreSphereMat, base: 0.8 });

  // Core inner glow
  const coreGlowGeo = new THREE.SphereGeometry(2.4, 32, 32);
  const coreGlowMat = new THREE.MeshBasicMaterial({
    color: 0x60a5fa,
    transparent: true,
    opacity: 0.15,
    blending: THREE.AdditiveBlending
  });
  const coreGlow = new THREE.Mesh(coreGlowGeo, coreGlowMat);
  coreGlow.position.y = 3;
  root.add(coreGlow);

  // Core data rings
  const ringRadii = [3.2, 4.4, 5.6];
  ringRadii.forEach((r, i) => {
    const ringGeo = new THREE.TorusGeometry(r, 0.06, 8, 80);
    ringGeo.rotateX(Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({
      color: i % 2 ? 0x38bdf8 : 0x60a5fa,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.y = 1.8 + i * 0.4;
    root.add(ring);
    refs.rings.push({ mesh: ring, dir: i % 2 ? -1 : 1 });
  });

  // Orbit ring
  const orbitGeo = new THREE.TorusGeometry(hubRadius, 0.04, 8, 128);
  orbitGeo.rotateX(Math.PI / 2);
  const orbitMat = new THREE.MeshBasicMaterial({
    color: 0x3b82f6,
    transparent: true,
    opacity: 0.2
  });
  const orbit = new THREE.Mesh(orbitGeo, orbitMat);
  orbit.position.y = stationY;
  root.add(orbit);

  // 6 station nodes
  STATIONS.forEach((s, i) => {
    const angle = (i / STATIONS.length) * Math.PI * 2 - Math.PI / 2;
    const x = Math.cos(angle) * hubRadius;
    const z = Math.sin(angle) * hubRadius;

    // Station pillar
    const pillarGeo = new THREE.CylinderGeometry(0.15, 0.25, stationY - 0.3, 12);
    const pillarMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(s.c),
      metalness: 0.7,
      roughness: 0.3,
      emissive: new THREE.Color(s.c),
      emissiveIntensity: 0.3
    });
    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
    pillar.position.set(x, (stationY - 0.3) / 2, z);
    root.add(pillar);

    // Station platform
    const platGeo = new THREE.CylinderGeometry(1.4, 1.6, 0.3, 24);
    const platMat = new THREE.MeshStandardMaterial({
      color: 0x0a1525,
      metalness: 0.75,
      roughness: 0.25,
      emissive: new THREE.Color(s.c),
      emissiveIntensity: 0.2
    });
    const plat = new THREE.Mesh(platGeo, platMat);
    plat.position.set(x, stationY, z);
    root.add(plat);

    // Station beacon crystal
    const beaconGeo = new THREE.OctahedronGeometry(0.8, 0);
    const beaconMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(s.c),
      metalness: 0.5,
      roughness: 0.2,
      emissive: new THREE.Color(s.c),
      emissiveIntensity: 1.0
    });
    const beacon = new THREE.Mesh(beaconGeo, beaconMat);
    beacon.position.set(x, stationY + 1.2, z);
    root.add(beacon);
    refs.beacons.push({ m: beaconMat, base: 1.0, ph: Math.random() * 6.28 });

    // Station glow
    const beaconGlowGeo = new THREE.SphereGeometry(1.4, 16, 16);
    const beaconGlowMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(s.c),
      transparent: true,
      opacity: 0.12,
      blending: THREE.AdditiveBlending
    });
    const beaconGlow = new THREE.Mesh(beaconGlowGeo, beaconGlowMat);
    beaconGlow.position.set(x, stationY + 1.2, z);
    root.add(beaconGlow);

    // Set station anchor for HTML labels
    refs.stationAnchors[s.key] = new THREE.Vector3(x, stationY + 1.2, z);
  });

  // Data packets orbiting
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const packetGeo = new THREE.SphereGeometry(0.25, 12, 12);
    const packetMat = new THREE.MeshBasicMaterial({
      color: i % 2 ? 0x38bdf8 : 0xa78bfa,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending
    });
    const packet = new THREE.Mesh(packetGeo, packetMat);
    packet.position.set(
      Math.cos(angle) * hubRadius,
      stationY,
      Math.sin(angle) * hubRadius
    );
    root.add(packet);
    refs.packets.push({
      mesh: packet,
      angle: angle,
      r: hubRadius,
      y: stationY
    });
  }

  // Connection lines from core to stations
  STATIONS.forEach((s, i) => {
    const angle = (i / STATIONS.length) * Math.PI * 2 - Math.PI / 2;
    const points = [
      new THREE.Vector3(0, 3, 0),
      new THREE.Vector3(Math.cos(angle) * hubRadius, stationY + 1.2, Math.sin(angle) * hubRadius)
    ];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
    const lineMat = new THREE.LineBasicMaterial({
      color: new THREE.Color(s.c),
      transparent: true,
      opacity: 0.25
    });
    const line = new THREE.Line(lineGeo, lineMat);
    root.add(line);
  });

  // Setup camera
  controls.target.set(0, 3, 0);
  const d = hubRadius * 2.2;
  camera.position.set(d * 0.65, d * 0.55, d * 0.8);
  camera.near = 0.1; camera.far = 200; camera.updateProjectionMatrix();
  controls.minDistance = hubRadius * 1.2;
  controls.maxDistance = hubRadius * 4;
  controls.maxPolarAngle = Math.PI / 2.05;
  controls.update();

  buildLabels();
  setActiveStation(activeStationKey);
  document.getElementById('load').classList.add('hide');
}

// Try loading GLB model, fallback to procedural hub on error
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('models/agent_hub_concept_refined_final.glb', (gltf) => {
  const root = gltf.scene; scene.add(root); refs.root = root;

  root.traverse(o => {
    if (!o.name) return;
    const n = o.name;
    if (/^data_packet_0\d/.test(n)) {
      const p = o.getWorldPosition(new THREE.Vector3());
      refs.packets.push({ mesh:o, angle: Math.atan2(p.z, p.x), r: Math.hypot(p.x, p.z), y: p.y });
    } else if (/^core_data_ring/.test(n)) {
      refs.rings.push({ mesh:o, dir: n.includes('upper') ? -1 : 1 });
    } else if (n === 'core_learning_profile_signal') {
      refs.coreSignal = o;
    } else if (/^core_emissive_window/.test(n) || n === 'core_learning_profile_signal') {
      if (o.isMesh && o.material) refs.coreEmis.push({ m:o.material, base:o.material.emissiveIntensity||1 });
    } else if (/_beacon$/.test(n) && o.isMesh && o.material) {
      refs.beacons.push({ m:o.material, base:o.material.emissiveIntensity||1, ph: Math.random()*6.28 });
    }
  });
  if (refs.coreSignal && refs.coreSignal.material) refs.coreEmis.push({ m: refs.coreSignal.material, base: refs.coreSignal.material.emissiveIntensity||5 });

  // station HTML anchors
  STATIONS.forEach(s => {
    const node = root.getObjectByName(`station_${s.no}_${s.key}_hologram_panel`);
    if (node) { refs.stationAnchors[s.key] = node.getWorldPosition(new THREE.Vector3()).clone(); refs.stationAnchors[s.key].y += 0.55; }
  });

  // frame camera
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.z);
  controls.target.set(0, 2.65, 0);
  const d = maxDim * 0.92;
  camera.position.set(d*0.72, maxDim*0.48, d*0.88);
  camera.near = maxDim/500; camera.far = maxDim*60; camera.updateProjectionMatrix();
  controls.minDistance = maxDim*0.55; controls.maxDistance = maxDim*2.2; controls.maxPolarAngle = Math.PI/2.06;
  controls.update();

  buildLabels();
  setActiveStation(activeStationKey);
  document.getElementById('load').classList.add('hide');
}, (p)=>{ if(p.loaded) ltxt.textContent='LOADING MODEL… '+(p.loaded/1048576).toFixed(1)+' MB'; },
   (e)=>{ console.warn('GLB model not found, using procedural fallback hub:', e); buildFallbackHub(); });

// ---- loop ----
let t0 = performance.now();
function loop(now){
  const t = (now - t0)/1000;
  controls.update();

  // data packets flow along orbit
  refs.packets.forEach(pk => { pk.angle += 0.32 * (1/60); const a = pk.angle; pk.mesh.position.set(pk.r*Math.cos(a), pk.y + Math.sin(t*2.4 + a*3)*0.04, pk.r*Math.sin(a)); });
  // core data rings spin
  refs.rings.forEach(r => { r.mesh.rotation.y += 0.01 * r.dir; });
  // core breathing
  const cb = 0.5 + 0.5*Math.sin(t*1.5);
  refs.coreEmis.forEach(e => { e.m.emissiveIntensity = e.base * (0.48 + cb*0.52); });
  if (refs.coreSignal) refs.coreSignal.scale.setScalar(1 + cb*0.08);
  refs.beacons.forEach(b => { b.m.emissiveIntensity = b.base * (0.5 + 0.45*(0.5+0.5*Math.sin(t*2 + b.ph))); });

  // 深蓝黑空间动效 — 对冲呼吸 + 吐纳
  const breathe = Math.sin(t*0.6);              // 全场呼吸相位 (-1..1)
  if (ENV.dust && ENV.dustGeo) {
    const D = ENV.dust, arr = ENV.dustGeo.attributes.position.array;
    for (let i=0;i<D.base.length;i++){
      const b = D.base[i];
      // 半径随呼吸朝中心汇聚(breathe<0)再扩散(breathe>0)，叠加个体微抖
      const r = b.r * (1 + breathe*0.07*b.amp) + Math.sin(t*b.sp*6 + b.ph)*0.6;
      const a = b.a + t*0.02 + Math.sin(t*0.1+b.ph)*0.02;
      arr[i*3] = r*Math.cos(a);
      arr[i*3+1] = b.y + Math.sin(t*b.sp*4 + b.ph)*0.8;
      arr[i*3+2] = r*Math.sin(a);
    }
    ENV.dustGeo.attributes.position.needsUpdate = true;
    ENV.particles.material.opacity = 0.28 + (breathe*0.5+0.5)*0.14; // 呼吸明暗
  }
  if (ENV.motesData && ENV.motesGeo) {
    const Mt = ENV.motesData, arr = ENV.motesGeo.attributes.position.array, dtl = 1/60;
    for (let i=0;i<Mt.data.length;i++){
      const m = Mt.data[i];
      m.y += m.vy*dtl;
      m.r -= m.inward*(m.y*0.04);         // 越升越被吸向中心
      if (m.y > 30 || m.r < 1.5){ m.y = 0; m.r = 6+Math.random()*46; m.a = Math.random()*Math.PI*2; }
      arr[i*3] = m.r*Math.cos(m.a);
      arr[i*3+1] = m.y;
      arr[i*3+2] = m.r*Math.sin(m.a);
    }
    ENV.motesGeo.attributes.position.needsUpdate = true;
    ENV.motes.material.opacity = 0.28 + (breathe*0.5+0.5)*0.16;
  }
  if (ENV.grid) ENV.grid.rotation.y = -t*0.004;
    ENV.scanRings.forEach((ring,i)=>{ const ph=(t*0.1 + i/2)%1; const rr=5+ph*120; ring.scale.set(rr,1,rr); ring.material.opacity=0.11*(1-ph); });

  // 核心数据环 + 光柱动效（对标概念图）
  if (ENV.FX){
    const F = ENV.FX;
    F.arcs.forEach(a=>{ a.mesh.rotation.y = t*a.sp + a.off; });
    F.rings.forEach((r,i)=>{ r.material.opacity = 0.22 + 0.09*Math.sin(t*1.4 + i*0.7); });
    if (F.beamMat) F.beamMat.uniforms.t.value = t;
    if (F.beamCore) F.beamCore.material.opacity = 0.38 + 0.12*Math.sin(t*3.2);
    if (F.beamOrb){ const s=1+0.1*Math.sin(t*2.4); F.beamOrb.scale.setScalar(s); F.beamOrb.material.opacity=0.36+0.1*Math.sin(t*2.4); }
    if (F.baseGlow) F.baseGlow.material.uniforms.col.value.setHSL(0.56, 0.62, 0.26+0.03*Math.sin(t*1.2));
  }

  composer.render();

  // overlay labels
  STATIONS.forEach(s => { const el = labels[s.key], anc = refs.stationAnchors[s.key]; if(!el||!anc) return;
    const pr = project(anc);
    const dist = camera.position.distanceTo(anc); const k = Math.max(.7, Math.min(1.12, 1.5-(dist-14)*0.03));
    const active = s.key === activeStationKey;
    const revealed = revealedStations.has(s.key);
    const x = active ? clamp(pr.x, 110, innerWidth - 110) : pr.x;
    const y = active ? clamp(pr.y, 142, innerHeight - 42) : pr.y;
    el.style.left = x+'px'; el.style.top = y+'px';
    const stateScale = active ? 1.08 : 0.9;
    el.style.transform = `translate(-50%,-100%) scale(${(k * stateScale).toFixed(3)})`;
    el.style.opacity = (active || pr.vis) && revealed ? (active ? 1 : 0.24) : 0;
    el.style.zIndex = active ? 900 : Math.round(420 - dist*8);
  });
  if (refs.coreSignal) { const pr = project(v.set(0,5.4,0)); corelab.style.left=pr.x+'px'; corelab.style.top=pr.y+'px'; corelab.style.opacity=pr.vis?1:0; }

  requestAnimationFrame(loop);
}
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); });
requestAnimationFrame(loop);

// capture helper for offline verification
window.__renderer = renderer;
window.__capBlit = function(){ composer.render(); const gl=renderer.getContext(),w=gl.drawingBufferWidth,h=gl.drawingBufferHeight,px=new Uint8Array(w*h*4); gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px);
  const sc=document.getElementById('snap')||document.createElement('canvas'); sc.id='snap'; sc.width=w; sc.height=h; sc.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;z-index:9999';
  const ctx=sc.getContext('2d'),img=ctx.createImageData(w,h); for(let y=0;y<h;y++){const sY=h-1-y;for(let x=0;x<w;x++){const s=(sY*w+x)*4,d=(y*w+x)*4;img.data[d]=px[s];img.data[d+1]=px[s+1];img.data[d+2]=px[s+2];img.data[d+3]=255;}} ctx.putImageData(img,0,0); document.body.appendChild(sc); return w+'x'+h; };
</script>
</body>
